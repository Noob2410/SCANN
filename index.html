<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Сверка QR / штрихкодов</title>
  <link rel="stylesheet" href="style.css?v=8" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <main class="app">
    <section class="left">
      <div class="panel input-panel">
        <textarea id="manualInput" placeholder="Добавить ID: Shift+Enter — новая строка, Enter — добавить"></textarea>
      </div>

      <div class="panel list-panel">
        <div class="panel-title">2. Осталось найти</div>
        <textarea id="targetList" readonly placeholder="Список для сверки..."></textarea>
      </div>

      <div class="panel file-panel">
        <label class="file-button">
          Загрузить файл
          <input id="fileInput" type="file" accept=".xlsx,.xls,.csv,.ods" />
        </label>

        <button id="fullscreenBtn" type="button">На весь экран</button>
        <button id="downloadLogBtn" type="button">Скачать лог</button>
        <button id="clearBtn" type="button">Очистить всё</button>

        <span id="fileName">Файл не выбран</span>
      </div>
    </section>

    <section class="right">
      <div id="scanPanel" class="panel scan-panel">
        <input id="scanInput" type="text" placeholder="Сканируй или введи номер вручную (Enter — проверить)..." autocomplete="off" />
        <div id="counter">Найдено: 0 / 0 | Осталось: 0</div>
      </div>

      <div class="panel found-panel">
        <div class="panel-title">5. Найденные совпадения</div>

        <textarea id="foundList" readonly placeholder="Здесь появятся найденные номера..."></textarea>

        <div id="logBox" class="log-box collapsed">
          <button id="toggleLogBtn" type="button" class="log-toggle">
            Журнал логов ▼
          </button>
          <textarea id="logList" readonly></textarea>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js?v=8"></script>
</body>
</html>
